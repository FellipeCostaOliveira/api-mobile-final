<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(titulo='Pet')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container-estreito">
    <div class="card">
        <h1 th:text="${modo == 'novo'} ? 'Novo pet' : 'Editar pet'">Pet</h1>

        <form th:action="${modo == 'novo'} ? @{/pets} : @{/pets/{id}(id=${petId})}"
              th:object="${petRequest}" method="post">

            <div class="form-grupo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" th:field="*{nome}"/>
                <div class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
            </div>

            <div class="form-grupo">
                <label for="especie">Espécie</label>
                <select id="especie" th:field="*{especie}">
                    <option th:each="e : ${especies}" th:value="${e}" th:text="${e.valor}"></option>
                </select>
                <div class="erro-campo" th:if="${#fields.hasErrors('especie')}" th:errors="*{especie}"></div>
            </div>

            <div class="form-grupo">
                <label for="raca">Raça</label>
                <input type="text" id="raca" th:field="*{raca}"/>
            </div>

            <div class="form-grupo">
                <label for="sexo">Sexo</label>
                <select id="sexo" th:field="*{sexo}">
                    <option th:each="s : ${sexos}" th:value="${s}" th:text="${s.valor}"></option>
                </select>
                <div class="erro-campo" th:if="${#fields.hasErrors('sexo')}" th:errors="*{sexo}"></div>
            </div>

            <div class="form-grupo">
                <label for="dataNascimento">Data de nascimento</label>
                <input type="date" id="dataNascimento" th:field="*{dataNascimento}"/>
                <div class="erro-campo" th:if="${#fields.hasErrors('dataNascimento')}" th:errors="*{dataNascimento}"></div>
            </div>

            <div class="form-grupo">
                <label for="peso">Peso (kg)</label>
                <input type="text" id="peso" th:field="*{peso}"/>
            </div>

            <div class="form-grupo">
                <label><input type="checkbox" th:field="*{castrado}" style="width:auto; display:inline;"/> Castrado</label>
            </div>

            <div class="form-grupo">
                <label for="observacoes">Observações</label>
                <textarea id="observacoes" th:field="*{observacoes}" rows="3"></textarea>
            </div>

            <button type="submit" class="btn" style="width:100%">Salvar</button>
        </form>
        <p style="margin-top:12px;"><a th:href="@{/pets}">&larr; Voltar para meus pets</a></p>
    </div>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
