<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(titulo='Criar conta')}"></head>
<body>
<div class="container-estreito">
    <div class="card">
        <h1>Criar conta</h1>

        <div class="alerta sucesso" th:if="${sucesso}" th:text="${sucesso}"></div>
        <div class="alerta erro" th:if="${erro}" th:text="${erro}"></div>

        <form th:action="@{/cadastro}" th:object="${cadastroRequest}" method="post">
            <div class="form-grupo">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" th:field="*{nome}"/>
                <div class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
            </div>
            <div class="form-grupo">
                <label for="email">E-mail</label>
                <input type="email" id="email" th:field="*{email}"/>
                <div class="erro-campo" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div class="form-grupo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" th:field="*{senha}"/>
                <div class="erro-campo" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></div>
            </div>
            <div class="form-grupo">
                <label for="telefone">Telefone</label>
                <input type="text" id="telefone" th:field="*{telefone}"/>
            </div>
            <div class="form-grupo">
                <label for="perfil">Perfil</label>
                <select id="perfil" th:field="*{perfil}">
                    <option value="TUTOR">Tutor</option>
                    <option value="VETERINARIO">Veterinário</option>
                </select>
                <div class="erro-campo" th:if="${#fields.hasErrors('perfil')}" th:errors="*{perfil}"></div>
            </div>
            <button type="submit" class="btn" style="width:100%">Criar conta</button>
        </form>

        <p style="margin-top:16px; text-align:center;">
            Já tem conta? <a th:href="@{/login}">Entrar</a>
        </p>
    </div>
</div>
</body>
</html>
