# Configuracao da aplicacao. So tem placeholders (${DB_URL} etc.) - os valores
# reais vem sempre de variaveis de ambiente, nunca sao escritos aqui.
server.port=${PORT:8080}

spring.application.name=clyvovet
# Espalha a criacao dos beans (em vez de tudo de uma vez no boot). Reduz o pico
# de memoria durante a inicializacao, que e exatamente onde o app crashava no
# plano Free do Render (512 MB). Efeito colateral aceitavel: a primeira
# requisicao de cada endpoint pode ficar alguns ms mais lenta.
spring.main.lazy-initialization=true

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

firebase.credentials=${FIREBASE_CREDENTIALS}

logging.level.br.com.fiap.clyvovet=DEBUG
logging.level.org.springframework.security=INFO
